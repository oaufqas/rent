stages:
  - build
  - deploy


build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD
    - echo "VITE_API_URL=https://kycaka.com/api" > ./client/.env
  script:
    - pwd
    - ls -la
    - ls -la ./client
    - cat ./client/.env
    - docker build -t $IMAGE_NAME .
    - docker push $IMAGE_NAME
  only:
    - master


deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache ansible openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan $DEPLOY_HOST >> ~/.ssh/known_hosts
  script:
    - ansible-playbook -i inventory/production.yml -e "image_tag=$IMAGE_TAG" playbooks/deploy.yml
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual


