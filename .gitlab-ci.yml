stages:
  - build
  - deploy


build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD
    - echo "VITE_API_URL=${VITE_API_URL}" > ./client/.env
  script:
    - docker build -t $IMAGE_NAME .
    - docker push $IMAGE_NAME
  only:
    - master


.ssh_conection: &ssh_connection
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache ansible openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan $DOMAIN >> ~/.ssh/known_hosts
    - echo "$VAULT_PASS" > ./ansible_deploy_rent/.vault_pass
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'


full-server-setup:
  <<: *ssh_connection
  script:
    - cd ansible_deploy_rent
    - ansible-playbook --tags setup-server ssl deploy ans_deploy.yml --vault-password-file .vault_pass
  when: manual


deploy-app:
  <<: *ssh_connection
  script:
    - cd ansible_deploy_rent
    - |
      ssh $DOMAIN "docker ps" || {
        echo "Server not ready! Run full-server-setup first"
        exit 1
      }
    - ansible-playbook --tags deploy ans_deploy.yml --vault-password-file .vault_pass
  when: on_success


renew-ssl:
  <<: *ssh_connection
  script:
    - cd ansible_deploy_rent
    - ansible-playbook --tags ssl ans_deploy.yml --vault-password-file .vault_pass
  when: manual









